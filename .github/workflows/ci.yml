name: CI

on:
  push:
    branches: [ main, 'v0.1.0-alpha' ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, format-check, test (host toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build dustc
        run: cargo build -p dustc --release
      - name: Run tests
        run: cargo test -p dustc

  lint:
    name: clippy (host toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: clippy
        run: cargo clippy -p dustc -- -D warnings
